<text x="403" y="432" class="label">Application Gateway WAF v2</text>
<rect x="390" y="480" width="370" height="65" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="403" y="505" class="heading">Check access and request limits</text>
<text x="403" y="527" class="label">API Management Premium (classic)</text>
<rect x="390" y="575" width="370" height="130" rx="9" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.5"/>
