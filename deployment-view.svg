<text x="362" y="1152" class="label">5. Existing systems use approved connections. They cannot directly change official payment records.</text>
<text x="362" y="1177" class="label">Database commits wait for a safe remote copy. Message copies can lag; replay from retained work.</text>
<rect x="1265" y="245" width="305" height="445" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="1278" y="270" class="heading">Entity B - separate systems</text>
<text x="1278" y="292" class="label">Separate live subscriptions</text>
<text x="1278" y="312" class="label">Separate recovery subscription</text>
<text x="1278" y="332" class="label">Separate application environment</text>
<text x="1278" y="352" class="label">Separate records and waiting work</text>
<text x="1278" y="372" class="label">Separate secrets and permissions</text>
<text x="1278" y="392" class="label"></text>
<text x="1278" y="412" class="label">Shared setup rules</text>
<text x="1278" y="432" class="label">do not give shared record access.</text>
<text x="1278" y="452" class="label"></text>
<text x="1278" y="472" class="label">Separate sign-in system if required</text>
<text x="1278" y="492" class="label">by the bank or country rules.</text>
<rect x="1265" y="735" width="305" height="385" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="1278" y="760" class="heading">6. Monitoring and security</text>
<text x="1278" y="782" class="label">Azure Monitor - service health</text>
<text x="1278" y="802" class="label">Keep approved activity records</text>
<text x="1278" y="822" class="label">Sentinel / Defender - security</text>
<text x="1278" y="842" class="label">Blob Storage - protected records</text>
<text x="1278" y="862" class="label"></text>
<text x="1278" y="882" class="label">Limit who can read records</text>
<text x="1278" y="902" class="label">Remove sensitive details</text>
<text x="1278" y="922" class="label">Store only in approved locations</text>
<text x="1278" y="942" class="label">Track cost per payment</text>
<text x="1278" y="962" class="label"></text>
<text x="1278" y="982" class="label">Practice full recovery quarterly</text>
<text x="1278" y="1002" class="label">Test saved copies monthly</text>
<polyline points="1240,785 1265,785" class="rep"/>
<rect x="24" y="1220" width="1546" height="78" rx="9" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
<text x="37" y="1245" class="heading">Recovery limits and responsibilities</text>
<text x="37" y="1267" class="label">Target: zero protected commits lost after one location fails. Resuming without remote protection needs prior bank approval.</text>
<text x="37" y="1287" class="label">Product owns applications. Platform owns shared setup. Data team owns SQL recovery. Payment and risk owners approve recovery modes.</text>
</svg>