<text x="383" y="340" class="heading">Approved main location</text>
<text x="383" y="362" class="label">A whole-location failure is possible</text>
<rect x="805" y="315" width="415" height="805" rx="9" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
<text x="818" y="340" class="heading">Approved recovery location</text>
<text x="818" y="362" class="label">Ready if the main location fails</text>
<rect x="390" y="385" width="370" height="65" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
