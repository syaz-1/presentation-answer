<rect width="1600" height="1320" fill="#f8fafc"/>
<text x="30" y="40" class="title">Microsoft Azure | Payment platform deployment</text>
<text x="30" y="66" class="label">Entity A is the example. Both locations need bank approval. Give every entity separate systems.</text>
<rect x="24" y="90" width="440" height="115" rx="9" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
<text x="37" y="115" class="heading">Customers and location choice</text>
<text x="37" y="137" class="label">Payment details go to the chosen location.</text>
<rect x="40" y="150" width="175" height="43" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="53" y="175" class="label">Customers</text>
