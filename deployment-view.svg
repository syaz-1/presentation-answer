<text x="261" y="175" class="label">1. Traffic Manager</text>
<polyline points="215,172 248,172" class="edge"/>
<rect x="490" y="90" width="1080" height="115" rx="9" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
<text x="503" y="115" class="heading">Shared rules and access checks</text>
<text x="503" y="137" class="label">Microsoft Entra ID checks access. Azure Policy enforces shared rules. Teams have separate responsibilities.</text>
<text x="503" y="157" class="label">Azure DevOps and Azure Container Registry help teams check and release approved application versions.</text>
<rect x="24" y="245" width="300" height="950" rx="9" fill="#eef2ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="37" y="270" class="heading">Existing systems</text>
<rect x="40" y="290" width="268" height="105" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="53" y="315" class="heading">Bank facilities</text>
<text x="53" y="337" class="label">Core banking / payment records</text>
<text x="53" y="357" class="label">Independent payment gateway</text>
<rect x="40" y="425" width="268" height="105" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="53" y="450" class="heading">Existing AWS applications</text>
<text x="53" y="472" class="label">Keep working during the move</text>
<text x="53" y="492" class="label">Approved protected connection</text>
<rect x="40" y="575" width="268" height="150" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="53" y="600" class="heading">5. Connections and checks</text>
<text x="53" y="622" class="label">ExpressRoute - private connection</text>
<text x="53" y="642" class="label">Azure Firewall Premium</text>
<text x="53" y="662" class="label">Find approved internal services</text>
<text x="53" y="682" class="label">Protect sensitive data in transit</text>
<rect x="40" y="785" width="268" height="110" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="53" y="810" class="heading">External payment systems</text>
<text x="53" y="832" class="label">Gateway rejects old sender</text>
<text x="53" y="852" class="label">Check result before sending again</text>
<rect x="40" y="960" width="268" height="175" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="53" y="985" class="heading">Connection rules</text>
<text x="53" y="1007" class="label">Allow only approved connections</text>
<text x="53" y="1027" class="label">Check private access paths</text>
<text x="53" y="1047" class="label">Test a separate backup route</text>
<text x="53" y="1067" class="label">A private connection alone</text>
<text x="53" y="1087" class="label">does not protect data from reading.</text>
